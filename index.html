  html,body{margin:0;padding:0;width:100%;height:100%;background:#000;overflow:hidden;

<body>
<canvas id="c"></canvas>
<script>
(() => {
'use strict';
const cv = document.getElementById('c');
const ctx = cv.getContext('2d', { alpha: false });   // opaque canvas: cheaper compositing
let W = 0, H = 0, DPR = 1, U = 1; // U = 1vmin in device px

// Eye geometry in vmin (matches billboard proportions)
const EW = 12.5, EH = 25, SEP = 17;

// v1.4: render at a reduced internal scale and let the compositor upscale. Full DPR on the
// Pixel Tablet is a 2560x1600 (4 MP) backing store redrawn every frame; ~1.3 px per CSS px is
// 2.4x fewer pixels and the soft-edged pill shapes look the same. ?rs=<px per css px> overrides.
const RS_MAX = +(new URLSearchParams(location.search).get('rs')) || 1.3;
function resize() {
  DPR = Math.min(window.devicePixelRatio || 1, RS_MAX, 3);
  W = Math.round(innerWidth * DPR); H = Math.round(innerHeight * DPR);
  cv.width = W; cv.height = H;
  U = Math.min(W, H) / 100;
}
addEventListener('resize', resize); resize();

const rnd = (a, b) => a + Math.random() * (b - a);
const pick = a => a[Math.floor(Math.random() * a.length)];
const clamp = (v, a, b) => Math.max(a, Math.min(b, v));
const ease = x => x < 0 ? 0 : x > 1 ? 1 : x * x * (3 - 2 * x);
const bump = (t, a, b, c, d) => ease((t - a) / (b - a)) * (1 - ease((t - c) / (d - c))); // 0->1 hold ->0

function eyeState() { return { w: 1, h: 1, dx: 0, dy: 0, rot: 0, happy: 0, lid: 0 }; }
function faceState() { return { fx: 0, fy: 0, frot: 0, fs: 1, bsq: 0, lx: 0, ly: 0, L: eyeState(), R: eyeState() }; }
const cur = faceState();
const tgt = faceState();                                           // per-frame targets, reused (no GC churn)
function resetEye(e) { e.w = 1; e.h = 1; e.dx = 0; e.dy = 0; e.rot = 0; e.happy = 0; e.lid = 0; }
function resetTarget(s) { s.fx = 0; s.fy = 0; s.frot = 0; s.fs = 1; s.bsq = 0; s.lx = 0; s.ly = 0; resetEye(s.L); resetEye(s.R); s.k = 10; s.peekX = 0; s.peekY = 0; s.noBlink = false; return s; }

// ---------- themes ----------
const Q = new URLSearchParams(location.search);
const APP = Q.get('app') === '1' || /GrokBotFace/.test(navigator.userAgent);
const BLOB_COLORS = ['#1A86FF', '#FF6A2B', '#2BC46B', '#8B5CF6'];
const THEMES = ['pills', 'blob', 'chars', 'clock', 'pong', 'chess', 'checkers', 'pacman', 'news', 'harness'];
let theme = THEMES.includes(Q.get('theme')) ? Q.get('theme') : 'pills';
let colorIdx = Math.floor(Math.random() * BLOB_COLORS.length);
let trans = null;            // {start, dur, to}
let enter = 1;               // 0 = scene offscreen below, 1 = in place
let nextThemeAt = 0;
// ---------- v1.9 auto-rotation: weighted random across looks (swipe / double-tap stay deterministic) ----------
const ROTATE = {
  weights: { bots: 45, clock: 25, news: 15, harness: 5, games: 10 },   // % of auto picks (news/harness drop out when the feed is down)
  dwell: { bots: [120, 240], clock: [120, 240], news: [120, 240], harness: [120, 240] },
  gameCapSec: 360,            // a game runs to its natural end (match point / mate / game over) or this cap
  gameGapSec: 1200,           // ~20 min between any two games; a game picked inside the window is re-rolled
  groupShare: 0.3,            // share of 'bots' picks that are a 2-3 bot group scene
};
const rot = { lastKey: '', games: [], lastGameAt: -1e9, enteredAt: 0, sawLive: false, endSeen: 0, picks: [] };
const gameLook = t => t === 'pong' || isGameTheme(t);
function lookKey() { return theme === 'chars' ? (cast.length > 1 ? 'group' : 'chars:' + (cast[0] && cast[0].name)) : theme; }
function scheduleTheme() {
  rot.enteredAt = now; rot.sawLive = false; rot.endSeen = 0; rot.lastKey = lookKey();
  if (gameLook(theme)) { nextThemeAt = now + ROTATE.gameCapSec; rot.games.push(theme); if (rot.games.length > 2) rot.games.shift(); rot.lastGameAt = now; }
  else { const d = ROTATE.dwell[theme === 'clock' ? 'clock' : theme === 'news' ? 'news' : theme === 'harness' ? 'harness' : 'bots']; nextThemeAt = now + rnd(d[0], d[1]); }
}
function gameEnded() {                                               // natural end of the game on screen, seen after we entered
  const over = theme === 'pong' ? pong.phase === 'win' : theme === 'chess' ? chess.over : theme === 'checkers' ? ck.over : theme === 'pacman' ? (pac.phase === 'over' || pac.phase === 'clear') : false;
  if (!over) { if (rot.endSeen) return true; rot.sawLive = true; return false; }   // end moment already passed (short holds)
  if (!rot.sawLive) return false;
  if (!rot.endSeen) rot.endSeen = now;
  return now - rot.endSeen > 2.2;                                    // let the win / mate / game-over moment land
}
function rotatePick() {
  const W0 = ROTATE.weights, cats = [];
  const gamesOk = now - rot.lastGameAt >= ROTATE.gameGapSec || rot.lastGameAt < -1e8;
  for (const k of ['bots', 'clock', 'news', 'harness', 'games']) {
    if ((k === 'news' || k === 'harness') && !newsReady()) continue;
    if (k === 'games' && !gamesOk) continue;                          // re-roll: games are rare treats
    cats.push([k, W0[k] || 0]);
  }
  for (let tries = 0; tries < 12; tries++) {
    let tot = 0; for (const c of cats) tot += c[1]; let r = Math.random() * tot, cat = cats[cats.length - 1][0];
    for (const c of cats) { r -= c[1]; if (r <= 0) { cat = c[0]; break; } }
    let pickL = null;
    if (cat === 'bots') {
      const roll = Math.random();
      if (roll < ROTATE.groupShare) pickL = { theme: 'chars', group: 2 + (Math.random() < 0.4 ? 1 : 0), key: 'group' };
      else { const opts = [{ theme: 'pills', key: 'pills' }, { theme: 'blob', key: 'blob' }].concat(ROSTER.map(c => ({ theme: 'chars', char: c, key: 'chars:' + c.name }))); pickL = pick(opts); }
    } else if (cat === 'games') {
      const opts = ['pong'].concat(GAME_THEMES).filter(g => rot.games.indexOf(g) < 0); pickL = { theme: pick(opts.length ? opts : ['pong'].concat(GAME_THEMES)) }; pickL.key = pickL.theme;
    } else pickL = { theme: cat, key: cat };
    if (pickL.key !== rot.lastKey) { rot.picks.push(cat); if (rot.picks.length > 200) rot.picks.shift(); return pickL; }
  }
  return { theme: 'pills', key: 'pills' };
}
function rotateTick() {                                              // called every frame (awake, no adventure, no takeover)
  if (trans || adv || bk.on || card.open) return;
  if (gameLook(theme)) rot.lastGameAt = now;
  const due = now > nextThemeAt || (gameLook(theme) && gameEnded());
  if (!due) return;
  const L = rotatePick();
  switchTheme(L.theme, L);
}
function switchTheme(to, spec) {
  if (trans) return;
  if (!to) { let i = THEMES.indexOf(theme), n = 0; do { i = (i + 1) % THEMES.length; } while (isNewsTheme(THEMES[i]) && !newsReady() && ++n < THEMES.length); to = THEMES[i]; }
  if (to === theme && !(to === 'chars' && spec)) return;
  trans = { start: now, dur: 2.6, to, swapped: false, spec: spec || null };
  move = null;
}
const backOut = x => { const c = 1.9; x = clamp(x, 0, 1) - 1; return 1 + (c + 1) * x * x * x + c * x * x; };
// ---------- swipe between looks (v1.3) ----------
let swipeX = 0, swipeSq = 0, swipeRot = 0;
function looks() { return [{ theme: 'pills' }, { theme: 'blob' }].concat(ROSTER.map(c => ({ theme: 'chars', char: c })), [{ theme: 'pong' }], GAME_THEMES.map(t => ({ theme: t })), newsReady() ? NEWS_THEMES.map(t => ({ theme: t })) : []); }
function currentLook() {
  if (theme === 'pills') return 0; if (theme === 'blob') return 1;
  if (theme === 'chars' && cast[0]) return 2 + ROSTER.indexOf(cast[0]);
  if (theme === 'pong') return 2 + ROSTER.length;
  if (isGameTheme(theme)) return 3 + ROSTER.length + GAME_THEMES.indexOf(theme);
  if (isNewsTheme(theme) && newsReady()) return 3 + ROSTER.length + GAME_THEMES.length + NEWS_THEMES.indexOf(theme);
  return -1;                                                       // clock
}
function swipeTo(dir) {                                            // dir: +1 next (swipe left), -1 previous (swipe right)
  if (trans) return;
  const L = looks(), i = currentLook(), n = L.length;
  const j = i < 0 ? (dir > 0 ? 0 : n - 1) : (i + dir + n) % n;
  if (adv) advCancel();                                            // a swipe always wins over an adventure
  trans = { kind: 'swipe', start: now, dur: 1.15, look: L[j], exit: -dir, swapped: false };
  move = null; sleeping = false;
}
function updateSwipe(t) {
  const ex = trans.exit, Wd = W * 1.25;
  if (t < 0.34) {                                                  // fling off with squash + wobble
    const k = t / 0.34;
    const ek = k * k * k * (k * (k * 6 - 15) + 10) * 0.35 + k * k * 0.65;  // eased start, still accelerating out
    swipeX = ex * Wd * ek; swipeSq = 0.18 * Math.sin(k * Math.PI * 0.5); swipeRot = ex * 0.12 * Math.sin(k * 9) * (1 - k * 0.5);
  } else {
    if (!trans.swapped) {
      trans.swapped = true; const L = trans.look;
      if (L.theme === 'blob' && theme !== 'blob') colorIdx = (colorIdx + 1) % BLOB_COLORS.length;
      theme = L.theme; if (L.char) { cast = [L.char]; comps = []; }
    }
    const k = clamp((t - 0.4) / 0.6, 0, 1);
    swipeX = t < 0.4 ? -ex * Wd : -ex * Wd * (1 - backOut(k));    // slide in from the other side, springy settle
    swipeSq = t < 0.4 ? 0 : -0.08 * Math.sin(k * Math.PI) * (1 - k);
    swipeRot = t < 0.4 ? 0 : -ex * 0.06 * Math.sin(k * 10) * (1 - k);
  }
  if (t >= 1) { trans = null; swipeX = swipeSq = swipeRot = 0; scheduleTheme(); play('hello'); }
}

function updateTransition() {
  if (trans && trans.kind === 'swipe') { enter = 1; updateSwipe((now - trans.start) / trans.dur); return; }
  if (!trans) { enter = 1; return; }
  const t = (now - trans.start) / trans.dur;
  if (t < 0.42) enter = 1 - Math.pow(ease(t / 0.42), 1.6);           // sink down
  else {
    if (!trans.swapped) { trans.swapped = true; theme = trans.to; if (theme === 'blob') colorIdx = (colorIdx + 1) % BLOB_COLORS.length;
      if (theme === 'chars') { const sp = trans.spec; if (sp && sp.char) { cast = [sp.char]; comps = []; } else pickCast(sp && sp.group ? sp.group : 0); } }
    enter = backOut((t - 0.48) / 0.52);                               // rise up with overshoot
    if (t < 0.48) enter = 0;
  }
  if (t >= 1) { trans = null; enter = 1; scheduleTheme(); play('lookaround'); }
}

// ---------- characters (Grok Bot avatar family) ----------
const ROSTER = [
  { name: 'Grok Bot', shape: 'circle', fill: '#0d0d0d', rim: '#303030', dot: '#3EC46D' },
  { name: 'Karl', shape: 'droplet', fill: '#5DC77A', dot: '#2F6FD6' },
  { name: 'Head of P', shape: 'circle', fill: '#A57EF7' },
  { name: 'Son of Me', shape: 'tri', fill: '#EE5257' },
  { name: 'Harness', shape: 'hex', fill: '#5CC4B0' },
  { name: 'Microsoft', shape: 'capsule', fill: '#4C8DF6' },
  { name: 'AWS', shape: 'cloud', fill: '#4C8DF6' },
  { name: 'Cursor', shape: 'pebble', fill: '#9E7A55' },
  { name: 'PLGE', shape: 'tri2', fill: '#F0823A' },
  { name: 'Newsletter', shape: 'circle', fill: '#F0823A' },
];
// eye placement per shape, in body-radius units
const EYEPOS = { circle: [0.12, -0.22], droplet: [0.16, -0.16], tri: [0.04, -0.3], tri2: [0.0, -0.18], hex: [0.04, -0.14],
  capsule: [0.22, -0.1], cloud: [0.14, -0.16], pebble: [0.1, -0.2] };
let cast = [], comps = [];
function pickCast(forceN) {
  const n = forceN || (Math.random() < 0.5 ? 1 : Math.random() < 0.6 ? 2 : 3);
  const pool = ROSTER.slice(); cast = [];
  // Grok Bot leads a third of the time; otherwise anyone
  if (Math.random() < 0.34) cast.push(pool.splice(0, 1)[0]);
  while (cast.length < n) cast.push(pool.splice(Math.floor(Math.random() * pool.length), 1)[0]);
  comps = cast.slice(1).map(() => ({ lx: 0, ly: 0, vx: 0, vy: 0, tlx: 0, tly: 0, lookNext: 0, blinkStart: -9, blinkNext: rnd(1, 5),
    hopStart: -9, hopNext: rnd(3, 8), phase: rnd(0, 6.28), happy: 0 }));
}
if (theme === 'chars') pickCast(+Q.get('cast') || 0);
function compHop(delay) { for (const c of comps) c.hopStart = now + rnd(0, delay || 0.25); }

// ---------- idle behaviour ----------
let now = 0;
let look = { x: 0, y: 0, next: 1 };
let blink = { start: -1, next: 2, double: false };
let lastInput = 0;            // seconds of last touch
let sleeping = false, sleepStart = 0;
let touch = null;             // {x,y} device px while finger down
let lookOverride = null;      // {x,y,until}
let showMark = true;
try { showMark = localStorage.getItem('grokbot.mark') !== '0'; } catch (e) {}

function scheduleBlink(t) { blink.next = t + rnd(1.8, 6); blink.double = Math.random() < 0.22; }
// close fast (40%), open slower (60%), C1-continuous ends -> no snap at the start/end of a blink
function blinkCurve(x) { return x < 0.4 ? ease(x / 0.4) : 1 - ease((x - 0.4) / 0.6); }
function blinkLid(t) {
  if (blink.start < 0) return 0;
  const d = t - blink.start, D = 0.17;
  let v = 0;
  if (d < D) v = blinkCurve(d / D);
  else if (blink.double && d > D + 0.08 && d < 2 * D + 0.08) v = blinkCurve((d - D - 0.08) / D);
  else if (d >= 2 * D + 0.1 || (!blink.double && d >= D)) blink.start = -1;
  return v;
}

// ---------- goofy moves ----------
// each: dur, apply(s, t, ctx) mutates target state; k = smoothing speed
const M = {
  wink: { dur: 1.1, init: m => m.side = pick([-1, 1]), apply(s, t, m) {
      const e = m.side < 0 ? s.L : s.R, o = m.side < 0 ? s.R : s.L, b = bump(t, 0.1, 0.25, 0.75, 0.95);
      e.happy = b; o.h = 1 + 0.05 * b; s.frot = 0.09 * m.side * b; s.lx = -0.3 * m.side * b; s.noBlink = true; } },
  happy: { dur: 2.2, apply(s, t) {
      const b = bump(t, 0, 0.25, 1.8, 2.2);
      s.L.happy = s.R.happy = b; s.fy -= Math.abs(Math.sin(t * 7)) * 2.2 * b; s.frot = 0.05 * Math.sin(t * 7) * b; s.noBlink = true; } },
  squint: { dur: 2.4, init: m => m.side = pick([-1, 1]), apply(s, t, m) {
      const b = bump(t, 0, 0.4, 1.9, 2.4);
      s.L.lid = s.R.lid = 0.55 * b; s.L.w = s.R.w = 1 + 0.12 * b; s.lx = m.side * 0.8 * b * ease((t - 0.4) / 1); s.noBlink = true; } },
  surprised: { dur: 1.8, k: 22, apply(s, t) {
      const b = bump(t, 0, 0.08, 1.3, 1.8);
      s.L.w = s.R.w = 1 + 0.18 * b; s.L.h = s.R.h = 1 + 0.28 * b; s.fs = 1 + 0.06 * b; s.fy -= 1.5 * b; s.lx = 0; s.ly = -0.15 * b; s.noBlink = true; } },
  cross: { dur: 2.3, apply(s, t) {
      const b = bump(t, 0, 0.35, 1.8, 2.3);
      s.L.dx += 9 * b; s.R.dx -= 9 * b; s.L.w = s.R.w = 1 - 0.15 * b; s.L.h = s.R.h = 1 - 0.1 * b; s.lx = 0; s.ly = 0.1 * b; s.L.rot = 0.08 * b; s.R.rot = -0.08 * b; s.noBlink = true; } },
  dizzy: { dur: 3, k: 18, apply(s, t) {
      const b = bump(t, 0, 0.3, 2.4, 3), a = t * 11;
      s.L.dx += 3.2 * Math.cos(a) * b; s.L.dy += 3.2 * Math.sin(a) * b;
      s.R.dx += 3.2 * Math.cos(a + Math.PI) * b; s.R.dy += 3.2 * Math.sin(a + Math.PI) * b;
      s.frot = 0.16 * Math.sin(t * 5) * b; s.lx = 0; s.ly = 0; s.L.w = s.R.w = 1 - 0.1 * b; s.noBlink = true; } },
  sleepy: { dur: 5, apply(s, t) {
      if (t < 3.4) {
        const d = ease(t / 3); s.L.lid = s.R.lid = 0.82 * d + 0.08 * Math.sin(t * 3) * d;
        s.fy += 3 * d + Math.sin(t * 2.2) * 0.8 * d; s.frot = 0.06 * d * Math.sin(t * 1.3); s.ly = 0.3 * d; s.noBlink = true;
      } else if (t < 3.6) { s.L.lid = s.R.lid = 1; s.fy += 3.5; s.noBlink = true; s.k = 30; }
      else { const b = 1 - ease((t - 3.6) / 1.4); s.L.h = s.R.h = 1 + 0.3 * b; s.L.w = s.R.w = 1 + 0.12 * b; s.fy -= 2 * b;
        s.lx = Math.sin((t - 3.6) * 14) * 0.9 * b; s.k = 28; s.noBlink = true; } } },
  bounce: { dur: 1.9, k: 26, apply(s, t) {
      const f = 1 - t / 1.9, ph = Math.sin(t * Math.PI * 3.2), up = Math.abs(ph);
      s.fy -= up * 7 * f; const sq = (1 - up) * f;
      s.L.h = s.R.h = 1 - 0.22 * sq + 0.08 * up * f; s.L.w = s.R.w = 1 + 0.18 * sq; s.ly = -0.3 * up * f; s.bsq = 0.07 * sq - 0.04 * up * f; } },
  wiggle: { dur: 1.6, k: 28, apply(s, t) {
      const f = 1 - t / 1.6; s.frot = 0.2 * Math.sin(t * 15) * f; s.fx += 1.5 * Math.sin(t * 15 + 1) * f; s.L.happy = s.R.happy = 0.5 * bump(t, 0, .2, 1.2, 1.6); } },
  peek: { dur: 5.5, k: 4, init: m => m.side = pick([-1, 1]), apply(s, t, m) {
      const b = bump(t, 0, 1.2, 4.2, 5.5);
      const edge = (W / 2 / U) - SEP * 0.35; // push face so outer eye sits at the edge
      if (theme === 'blob') { s.peekY = 0.42 * b; s.ly = -0.8 * b; } else if (theme !== 'clock') s.peekX = m.side * edge * b; s.lx = m.side * (t > 1.2 && t < 4.2 ? (Math.sin(t * 2.4) > -0.3 ? 1 : -0.6) : 0.5) * b;
      s.ly = 0.15 * Math.sin(t * 1.7) * b; s.frot = 0.05 * m.side * b; s.k = 4; } },
  bigsmall: { dur: 2.6, init: m => m.side = pick([-1, 1]), apply(s, t, m) {
      const b = bump(t, 0, 0.35, 2.1, 2.6), big = m.side < 0 ? s.L : s.R, sm = m.side < 0 ? s.R : s.L;
      big.w = big.h = 1 + 0.38 * b; sm.w = sm.h = 1 - 0.35 * b; sm.lid = 0.15 * b; s.frot = -0.08 * m.side * b; s.lx = 0; } },
  lookaround: { dur: 2.4, k: 24, apply(s, t) {
      const seq = [[-1, 0], [1, 0], [0, -0.9], [0.7, 0.7], [0, 0]]; const i = Math.min(4, Math.floor(t / 0.48));
      s.lx = seq[i][0]; s.ly = seq[i][1]; } },
  // sense-driven moves (not picked randomly)
  smile: { dur: 2.0, k: 24, apply(s, t) {
      const b = bump(t, 0, 0.15, 1.6, 2.0), f = 1 - t / 2.0;
      s.L.happy = s.R.happy = b; s.fy -= Math.abs(Math.sin(t * 8)) * 4 * f; s.bsq = 0.05 * Math.max(0, Math.cos(t * 16)) * f; s.noBlink = true; } },
  shy: { dur: 2.6, apply(s, t) {
      const b = bump(t, 0, 0.3, 2.0, 2.6);
      s.L.dx += 6 * b; s.R.dx -= 6 * b; s.L.lid = s.R.lid = 0.35 * b; s.ly = 0.55 * b; s.lx = 0;
      s.fs = 1 - 0.07 * b; s.frot = 0.07 * b; s.fy += 1.5 * b; s.noBlink = true; } },
  startle: { dur: 1.3, k: 32, apply(s, t) {
      const b = bump(t, 0, 0.05, 0.7, 1.3), j = Math.sin(clamp(t / 0.45, 0, 1) * Math.PI);
      s.fy -= 9 * j; s.L.w = s.R.w = 1 + 0.2 * b; s.L.h = s.R.h = 1 + 0.32 * b; s.fs = 1 + 0.05 * b; s.bsq = -0.06 * j; s.noBlink = true; } },
  waveBack: { dur: 2.6, k: 22, apply(s, t) {
      const f = 1 - t / 2.6, b = bump(t, 0, 0.2, 2.1, 2.6);
      s.frot = 0.2 * Math.sin(t * 11) * f; s.fx += 3 * Math.sin(t * 6) * f; s.fy -= Math.abs(Math.sin(t * 6)) * 2.5 * f;
      s.L.happy = s.R.happy = b; s.noBlink = true; } },
  launch: { dur: 1.4, k: 24, apply(s, t) {                       // opening the Grok Bot app

// ---- multiplying: one Grok Bot splits 1 -> 2 -> 4 -> 8 -> 16 roster bots, waves, merges back ----

ADV_DRAW.multiplying = (t, a) => {

  const sp = Math.min(land ? W * 0.105 : W * 0.21, H * 0.7 / rows), Rl = sp * 0.36, cy = H * 0.47;

  if (t < TS[0]) { g = -1; }
